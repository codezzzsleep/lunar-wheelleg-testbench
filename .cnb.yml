# CNB 云原生开发：打开即用的 lunar-lab 沙箱
# 结构：镜像自检 → 拉项目 → bootstrap → 确定性检查 → 统一验收 → 判定快照
$:
  vscode:
    - name: lunar-lab-sandbox
      runner:
        cpus: 8
        tags: cnb:arch:amd64
      docker:
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest   # 回退，必写；stage 1 会断言镜像是否生效
      services:
        - vscode
      env:
        MUJOCO_GL: osmesa
        CNB_WELCOME_CMD: bash /workspace/lunar-lab/.cnb/welcome.sh
      stages:
        - name: 1. 镜像自检
          script: |
            set -e
            python3 -V
            python3 -c "import mujoco, numpy, trimesh; print('deps ok', mujoco.__version__, numpy.__version__, trimesh.__version__)"
            MUJOCO_GL=osmesa python3 -c "import mujoco; mujoco.MjModel.from_xml_string('<mujoco><worldbody><geom size=\".1\"/></worldbody></mujoco>'); print('osmesa+model ok')"
            command -v code-server >/dev/null && code-server --version | head -1 || echo "WARN: 无 code-server（镜像可能回退）"

        - name: 2. 就位（不重复 clone）
          script: |
            set -e
            cd /workspace
            # CNB 工作区已把仓库 checkout 到 /workspace/<repo>；只有缺失时才从 CNB 拉，
            # 不从 GitHub 拉（慢且可能被墙）。
            if [ ! -d lunar-lab/.git ]; then
              git clone --depth 1 https://cnb.cool/ycyc755/lunar-lab-r1.git lunar-lab
            fi
            cd lunar-lab
            git log -1 --format='repo @ %h %s'
            git status -sb | head -1

        - name: 3. bootstrap（幂等）
          script: |
            set -e
            cd /workspace/lunar-lab
            bash .cnb/bootstrap.sh

        - name: 4. 渲染与仿真烟测
          script: |
            set -e
            cd /workspace/lunar-lab
            bash .cnb/smoke.sh

        - name: 5. 结构验收 / 完整验收
          script: |
            set -e
            cd /workspace/lunar-lab
            if [ -f runs/unseen/delivery_v7/v7_20261030_r1/verify/r1_report.json ]; then
              echo "证据包存在 -> 跑完整 73 项验收"
              python3 scripts/verify_delivery_r1.py
            else
              echo "无证据包（源码快照）-> 跑结构性验收"
              python3 scripts/run_r1.py --audit || true
              python3 scripts/run_r1.py --dry-run | head -30
              python3 -m compileall -q scripts && echo "compileall ok"
            fi

        - name: 6. 判定快照
          script: |
            set -e
            cd /workspace/lunar-lab
            {
              echo "=== lunar-lab sandbox snapshot ==="
              python3 -V
              python3 -c "import mujoco,numpy,trimesh;print('mujoco',mujoco.__version__,'numpy',numpy.__version__,'trimesh',trimesh.__version__)"
              echo "verify: 见 stage 5"
              echo "repo $(git rev-parse --short HEAD)"
            } | tee /workspace/lunar-lab/.cnb/last_snapshot.txt
      endStages:
        - name: 销毁前留档
          script: |
            cd /workspace/lunar-lab 2>/dev/null || exit 0
            git status --porcelain | head -20
            cp -f .cnb/last_snapshot.txt /workspace/last_snapshot.txt 2>/dev/null || true
